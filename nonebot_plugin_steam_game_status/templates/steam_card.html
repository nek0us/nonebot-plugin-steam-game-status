<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>

        html, body {
            margin: 0;
            padding: 0;
            background-color: #171a21;
            font-family: "Microsoft YaHei", "Arial", sans-serif;
            width: fit-content;
        }

        /* 卡片 */
        .steam-card {
            display: flex;
            align-items: center;
            /* Steam 经典深色 */
            background: linear-gradient(135deg, #1b2838 0%, #171a21 100%);
            padding: 10px;
            border-radius: 4px;
            box-sizing: border-box;
            width: 356px;
            min-height: 88px;
            border: 1px solid #2a475e;
            position: relative;
            overflow: hidden;
        }

        .steam-card.game-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(90deg, rgba(23, 26, 33, 0.94) 0%, rgba(23, 26, 33, 0.80) 42%, rgba(23, 26, 33, 0.34) 78%, rgba(23, 26, 33, 0.08) 100%),
                var(--game-background-url);
            background-size: cover;
            background-position: center right;
            pointer-events: none;
            z-index: 0;
        }

        .steam-card.grayscale-background::before {
            filter: grayscale(1);
        }


        .avatar-box {
            position: relative;
            margin-right: 12px;
            flex-shrink: 0;
            z-index: 2;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 4px;
            display: block;
        }

        .steam-card.grayscale-avatar .avatar {
            filter: grayscale(1);
        }


        .avatar-border {
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border: 3px solid #90ba3c;
            border-radius: 6px;
            pointer-events: none;
        }

        .steam-card.stopped .avatar-border {
            border-color: #66c0f4;
        }


        .info-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
            max-width: 240px;
        }


        .player-name {
            font-size: 20px;
            font-weight: bold;
            color: #90ba3c;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .steam-card.stopped .player-name {
            color: #66c0f4;
        }


        .action-text {
            font-size: 14px;
            color: #c6d4df;
            margin-bottom: 4px;
        }


        .game-name {
            font-size: 17px;
            color: #ffffff;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 2px black;
        }

        .bg-watermark {
            display: none;
            position: absolute;
            right: -16px;
            bottom: -24px;
            font-size: 118px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.03);
            transform: rotate(-10deg);
            pointer-events: none;
            user-select: none;
            z-index: 1;
        }

        .steam-card.show-watermark .bg-watermark {
            display: block;
        }

        .steam-card.compact {
            padding: 7px 9px;
            width: 260px;
            min-height: 72px;
        }

        .steam-card.compact .avatar-box {
            margin-right: 8px;
        }

        .steam-card.compact .avatar {
            width: 52px;
            height: 52px;
        }

        .steam-card.compact .info-box {
            max-width: 176px;
        }

        .steam-card.compact .player-name {
            font-size: 16px;
        }

        .steam-card.compact .action-text {
            font-size: 12px;
            margin-bottom: 3px;
        }

        .steam-card.compact .game-name {
            font-size: 14px;
        }

        .steam-card.compact .bg-watermark {
            right: -12px;
            bottom: -18px;
            font-size: 88px;
        }

        .steam-card.wide {
            width: 406px;
        }

        .steam-card.wide .info-box {
            max-width: 290px;
        }
    </style>
</head>
<body>
    <div class="steam-card {{ card_class }}" style="{{ background_style }}">
        <div class="bg-watermark">Steam</div>
        <div class="avatar-box">
            <img
                src="{{ avatar_url }}"
                onerror="this.onerror=null;this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 viewBox%3D%220 0 100 100%22%3E%3Crect width%3D%22100%25%22 height%3D%22100%25%22 fill%3D%22%232a475e%22%2F%3E%3Ctext x%3D%2250%25%22 y%3D%2250%25%22 dominant-baseline%3D%22middle%22 text-anchor%3D%22middle%22 font-family%3D%22Microsoft YaHei%22 font-size%3D%2230%22 fill%3D%22%238f98a0%22%3E头像%3C%2Ftext%3E%3C%2Fsvg%3E';this.style.padding='0';this.style.objectFit='cover';"
                class="avatar"
                alt="avatar"
            >
            <div class="avatar-border"></div>
        </div>

        <div class="info-box">
            <div class="player-name">{{ player_name }}</div>
            <div class="action-text">{{ action_text }}</div>
            <div class="game-name">{{ game_name }}</div>
        </div>
    </div>
</body>
</html>
